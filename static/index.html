<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="calculator-container">
      <div class="theme-toggle">
        <h1>calc</h1>
        <div class="theme-toggle-label">THEME</div>
        <div class="theme-toggle-switch">
          <div class="theme-toggle-switch-thumb"></div>
        </div>
      </div>
      <div class="display"></div>
      <div class="buttons">
        <button class="btn">7</button>
        <button class="btn">8</button>
        <button class="btn">9</button>
        <button class="btn btn-del">DEL</button>
        <button class="btn">4</button>
        <button class="btn">5</button>
        <button class="btn">6</button>
        <button class="btn">+</button>
        <button class="btn">1</button>
        <button class="btn">2</button>
        <button class="btn">3</button>
        <button class="btn">-</button>
        <button class="btn">.</button>
        <button class="btn">0</button>
        <button class="btn">/</button>
        <button class="btn">*</button>
        <button class="btn btn-reset">RESET</button>
        <button class="btn btn-equal">=</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
